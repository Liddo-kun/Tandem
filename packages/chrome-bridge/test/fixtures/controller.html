<!doctype html>
<meta charset="utf-8" />
<title>Tandem Controller Fixture</title>
<style>
  body {
    font: 16px sans-serif;
    margin: 24px;
    background: #f4f6fa;
  }
  input,
  textarea,
  button {
    font: inherit;
    padding: 10px;
    margin: 8px;
  }
  #scroll {
    width: 360px;
    height: 130px;
    overflow: scroll;
    overscroll-behavior: contain;
    border: 3px solid #234;
  }
  #wide {
    width: 1100px;
    height: 750px;
    background: linear-gradient(135deg, #92b8ee, #fff0a0);
  }
  iframe {
    width: 700px;
    height: 260px;
    border: 4px solid #735;
  }
</style>
<h1>Tandem Controller Live Fixture</h1>
<label>Name <input aria-label="Name" value="original populated value" /></label>
<label>Notes <textarea aria-label="Notes">initial notes</textarea></label>
<div contenteditable="true" aria-label="Editor">initial <b>editable</b> text</div>
<div id="controlled"></div>
<button id="submit">Submit once</button><button id="route">SPA route</button>
<button id="replace">Replace target</button><button id="victim">Original target</button>
<div id="shadow"></div>
<div id="scroll"><div id="wide">Two-axis wheel target</div></div>
<iframe id="frame" title="Outer frame"></iframe>
<button id="remove-frame">Remove frame</button>
<button id="reload-frame">Reload frame</button>
<button id="overlay">Obstruct submit</button>
<button id="tall">Tall document</button>
<script>
  const query = new URL(location.href).searchParams
  const token = query.get("token"),
    name = query.get("name") || "main"
  const state = {
    name,
    input: "",
    notes: "",
    editor: "",
    controlled: "",
    frameworkState: "",
    clicks: 0,
    shadow: 0,
    frame: 0,
    frameLoads: 0,
    events: [],
    scrollX: 0,
    scrollY: 0,
    wheels: 0,
    documentScrollEnds: 0,
    documentScrollY: 0,
    ready: true,
    sequence: 0,
    dpr: devicePixelRatio,
  }
  function report() {
    state.sequence++
    state.documentScrollY = window.scrollY
    state.scrollBounds = document.querySelector("#scroll").getBoundingClientRect().toJSON()
    state.scrollMaxX = document.querySelector("#scroll").scrollWidth - document.querySelector("#scroll").clientWidth
    state.scrollMaxY = document.querySelector("#scroll").scrollHeight - document.querySelector("#scroll").clientHeight
    fetch("/state?token=" + encodeURIComponent(token), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(state),
    })
  }
  document.addEventListener("input", (e) => {
    state.events.push({ type: e.type, trusted: e.isTrusted, data: e.data })
    state.input = document.querySelector("input").value
    state.notes = document.querySelector("textarea").value
    state.editor = document.querySelector("[contenteditable]").textContent
    state.controlled = document.querySelector("#controlled input")?.value || ""
    state.frameworkState = document.querySelector("#controlled input")?.dataset.state || ""
    // Input fires before Chromium finishes editing/normalizing contenteditable markup.
    setTimeout(report, 0)
  })
  document.addEventListener("keydown", (e) => {
    state.events.push({ type: e.type, trusted: e.isTrusted, key: e.key })
    report()
  })
  document.querySelector("#submit").onclick = (e) => {
    state.clicks++
    state.events.push({ type: "click", trusted: e.isTrusted })
    report()
  }
  document.querySelector("#route").onclick = () => {
    history.pushState({}, "", "?" + query.toString() + "&route=next")
    report()
  }
  document.querySelector("#replace").onclick = () => {
    document.querySelector("#victim").outerHTML = '<button id="victim">Replacement target</button>'
    report()
  }
  document.querySelector("#remove-frame").onclick = () => document.querySelector("#frame").remove()
  document.querySelector("#reload-frame").onclick = () =>
    document.querySelector("#frame").contentWindow.location.reload()
  document.querySelector("#frame").addEventListener("load", () => {
    state.frameLoads++
    report()
  })
  document.querySelector("#overlay").onclick = () => {
    const box = document.querySelector("#submit").getBoundingClientRect()
    const cover = document.createElement("div")
    cover.style.cssText = `position:absolute;z-index:999999;background:red;left:${box.x + scrollX}px;top:${box.y + scrollY}px;width:${box.width}px;height:${box.height}px`
    document.body.append(cover)
  }
  document.querySelector("#tall").onclick = () => {
    const space = document.createElement("div")
    space.style.height = "1500px"
    space.textContent = "Scroll boundary fixture"
    document.body.append(space)
  }
  const root = document.querySelector("#shadow").attachShadow({ mode: "open" })
  root.innerHTML = '<button style="padding:12px">Shadow button</button>'
  root.querySelector("button").onclick = (e) => {
    state.shadow++
    state.events.push({ type: "shadow", trusted: e.isTrusted })
    report()
  }
  document.querySelector("#scroll").onscroll = (e) => {
    state.scrollX = e.target.scrollLeft
    state.scrollY = e.target.scrollTop
    report()
  }
  document.querySelector("#scroll").addEventListener("wheel", () => {
    state.wheels++
    report()
  })
  document.addEventListener("scrollend", () => {
    state.documentScrollEnds++
    report()
  })
  document.querySelector("#frame").src = "/frame?token=" + token + "&name=" + name
  window.addEventListener("message", (e) => {
    if (e.origin === location.origin && e.data === "frame-click") {
      state.frame++
      report()
    }
  })
  report()
  document.addEventListener("fixture:controlled-ready", () => {
    state.controlled = document.querySelector("#controlled input").value
    state.frameworkState = document.querySelector("#controlled input").dataset.state
    report()
  })
  const controlled = document.createElement("script")
  controlled.type = "module"
  controlled.src = "/controlled.js?token=" + encodeURIComponent(token)
  document.body.append(controlled)
</script>
